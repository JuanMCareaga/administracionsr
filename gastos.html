<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos</title>
    <link rel="stylesheet" href="tareas.css">
</head>
<body data-view="expenses">
    <nav class="navbar" aria-label="Navegación principal">
        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false">☰</button>
        <div class="nav-links" id="nav-links">
            <a href="tareas.html">Tareas</a>
            <a href="stock.html">Stock</a>
            <a class="active" href="gastos.html">Gastos</a>
        </div>
    </nav>
    <main class="container">
        <h1>Gastos 💸</h1>
        <p class="subtitle">Registrá tus gastos y consultá el total.</p>
        <form class="expense-form" id="expense-form">
            <input type="text" id="expense-name" placeholder="Nombre del gasto" autocomplete="off" required>
            <input type="number" id="expense-value" placeholder="Valor" min="0" step="0.01" aria-label="Valor del gasto" required>
            <button class="add-button" type="submit">+ Agregar</button>
        </form>
        <div class="expense-total" id="expense-total">Total: $0,00</div>
        <div class="expense-actions">
            <button class="clear-all-button" id="clear-expenses-button" type="button" hidden>Eliminar todos</button>
            <button class="export-button" id="export-expenses-button" type="button" disabled>Exportar para Excel</button>
        </div>
        <ul id="expense-list"></ul>
    </main>
    <script src="app.js"></script>
</body>
</html>
